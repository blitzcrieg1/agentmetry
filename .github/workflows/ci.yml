name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# The job names below are mirrored by hand in branch protection on master
# (Settings > Branches > Require status checks). GitHub matches required checks
# by exact string, so renaming a job, or adding an OS to the matrix, leaves a
# required context that nothing will ever report. Master then silently accepts
# no pull requests at all, which you will not notice while pushing direct and
# the next contributor will. Adding windows-latest here did exactly that: the
# jobs became "orchestrator (ubuntu-latest)" and "orchestrator (windows-latest)"
# while protection still waited on a bare "orchestrator".
#
# Rename or re-matrix a job here, update the required contexts in the same
# sitting. Current list:
#
#   orchestrator (ubuntu-latest)
#   orchestrator (windows-latest)
#   hooks-windows
#   dashboard
#   CLAAssistant           <- from cla.yml, not this file
#
# Deliberately NOT required: `supply-chain` here, and `analyze` in codeql.yml.
# Both report on the world rather than on the diff, so a CVE published overnight
# would block a docs typo through no change of ours. A red X the maintainer
# reads is worth more than a blocking gate the maintainer learns to bypass.
#
# Read them back with:
#   gh api repos/blitzcrieg1/agentmetry/branches/master/protection/required_status_checks --jq .contexts
jobs:
  orchestrator:
    # Agentmetry is installed on Windows first. Running the suite only on Linux
    # is how a path bug reached a release once already, so Windows is a required
    # leg, not an optional nightly.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the pushed commit range; a shallow clone can't walk it
          # (surfaces as "failed to scan Git repository: stderr is not empty").
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install orchestrator
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check agentmetry tests
      - name: Secret scan
        # The gitleaks action ships a Linux container only.
        if: matrix.os == 'ubuntu-latest'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: pytest -q

      - name: Coverage floor
        # A number that only ever goes up, checked on one OS so the gate is a
        # single fact rather than a race between two runners.
        #
        # The floor is deliberately a few points under the current figure. Set
        # flush against it and an unrelated refactor that moves a branch turns
        # master red for no defect, which is how a coverage gate gets deleted.
        # Raise it when a deliberate push clears it, not automatically.
        if: matrix.os == 'ubuntu-latest'
        run: pytest -q --cov=agentmetry --cov-report=term --cov-fail-under=78

  hooks-windows:
    # The PowerShell installers and the hook client are the parts a user runs
    # before anything else works. Exercise them on the OS they target.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install orchestrator
        working-directory: apps/orchestrator
        run: pip install -e ".[dev]"
      - name: Start orchestrator
        shell: pwsh
        working-directory: apps/orchestrator
        run: |
          Start-Process python -ArgumentList @(
            "-m","uvicorn","agentmetry.api.main:app","--host","127.0.0.1","--port","8000"
          ) -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            try {
              Invoke-RestMethod http://127.0.0.1:8000/api/v1/health -TimeoutSec 3 | Out-Null
              $up = $true
            } catch { $up = $false }
          } while (-not $up -and (Get-Date) -lt $deadline)
          if (-not $up) { throw "orchestrator did not come up" }
      - name: Hook client selftest
        # The one check that proves capture works end to end on Windows: the
        # hook posts a real event and the orchestrator accepts it.
        run: python scripts/agentmetry_ingest.py selftest
      - name: Doctor
        working-directory: apps/orchestrator
        run: python -m agentmetry.cli doctor
      - name: Parse installer scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  supply-chain:
    # Nothing here inspects the diff. It asks whether anything the recorder
    # already depends on has since been found vulnerable, which is a question
    # whose answer changes without anybody touching this repository. That is
    # also why it runs on a schedule rather than only on push.
    #
    # The MSI ships a frozen Python environment, so a CVE in a transitive
    # dependency reaches a customer machine inside our binary. "We would have
    # noticed" is not a control, and a tool that inspects other people's supply
    # chains having no view of its own is the first thing a security buyer asks
    # about and the worst one to have no answer for.
    name: supply-chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install orchestrator
        run: |
          # pip audits itself, and a runner's bundled pip is routinely a few
          # releases behind whatever advisory landed this month. Upgrading first
          # keeps the finding list about our dependencies rather than about the
          # installer that fetched them.
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Audit dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit --progress-spinner off --strict

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dashboard
        run: npm ci
      - name: Lint dashboard
        run: npm run lint
      - name: Test dashboard
        run: npm run test
      - name: Build dashboard
        run: npm run build
