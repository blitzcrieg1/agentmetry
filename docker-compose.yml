# Agentmetry recorder: the orchestrator API, serving the dashboard, in one
# container. For the Loki + Grafana homelab stack see docker-compose.loki.yml.
#
#   docker compose up -d --build
#   open http://127.0.0.1:8000
#
# This file used to start the agent runtime this repository used to be: Qdrant,
# Postgres (with the password "agentmetry" in plain text), Ollama and Gemini
# settings, none of which the recorder uses, plus a dashboard image that could
# not build (it expected a Next.js standalone output; the dashboard exports
# static files). See #209.

services:
  agentmetry:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    # Loopback only. The API is not meant for the network; publish it wider
    # only behind your own auth and TLS.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENTMETRY_API_KEY: ${AGENTMETRY_API_KEY:-}
      AGENTMETRY_FLEET_ID: ${AGENTMETRY_FLEET_ID:-}
    volumes:
      - agentmetry_data:/data
    restart: unless-stopped

volumes:
  agentmetry_data:
