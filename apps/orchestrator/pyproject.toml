[project]
name = "agentmetry"
dynamic = ["version"]
description = "Local-first flight recorder for AI coding agents: hash-chained audit trail, MITRE-mapped sequence detection, DLP"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ioannis L." }]
keywords = [
    "ai-security", "ai-agents", "agentic-ai", "audit-log", "siem",
    "mitre-attack", "dlp", "claude-code", "cursor", "devsecops", "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "mcp>=1.2",
    # Windows ships no IANA timezone database, so `zoneinfo` cannot resolve
    # AGENTMETRY_BUSINESS_TZ there without this. Without it the off-hours rule
    # silently fell back to UTC and produced wrong findings on the platform this
    # product primarily targets.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# ruff is pinned exactly. `ruff>=0.8` meant CI installed whatever was newest,
# so a linter release could turn a green branch red with no change to this repo.
# It did: 0.16.0 widened the default rule set and CI reported 132 errors against
# code that passed locally on 0.15.x. Bump this deliberately, not by accident.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff==0.16.0"]

[project.urls]
Homepage = "https://agentmetry.ai"
Source = "https://github.com/blitzcrieg1/agentmetry"
Issues = "https://github.com/blitzcrieg1/agentmetry/issues"
Changelog = "https://github.com/blitzcrieg1/agentmetry/blob/master/CHANGELOG.md"

[project.scripts]
agentmetry = "agentmetry.cli:main"
# Separate console script rather than only `agentmetry hook`, because this one
# runs on every tool call. The CLI module pulls in httpx, sqlite3 and zipfile at
# import; the ingest client is stdlib plus the enrichment it actually uses. A
# hook has no reason to pay for the parts of the CLI it will never call.
#
# It also gives an installed machine an absolute path a hook config can name.
# Before this, capture required a git checkout, so the MSI shipped a recorder
# that no hook could reach.
agentmetry-hook = "agentmetry.hooks.ingest:main"

# Third-party enterprise packages register here, e.g.:
# [project.entry-points."agentmetry.extensions"]
# enterprise = "agentmetry_enterprise.register:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "agentmetry/core/version.py"

[tool.hatch.build.targets.wheel]
packages = ["agentmetry"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rule set is stated rather than inherited. Ruff's defaults are not a
# stable contract across releases, so an unstated selection makes lint results
# depend on install date. These are ruff's classic defaults: pyflakes plus the
# pycodestyle errors worth failing a build over.
# S is bandit and B is bugbear. A tool that inspects other people's supply
# chains should run a security linter over its own, and "we did not have one"
# is a bad answer to the first question a security buyer asks about the SDLC.
select = ["E4", "E7", "E9", "F", "B", "S"]

# Reviewed once, per rule, rather than sprinkled as inline noqa across forty
# call sites. Anything not listed here is expected to be fixed, not silenced.
ignore = [
  # S603 fires on *every* subprocess call, including the safe form. Passing an
  # argument list without shell=True is the mitigation, and this project spawns
  # processes by design: schtasks to register autostart, python to launch the
  # orchestrator, powershell for the installers. Ruff's own docs say the rule
  # needs manual review rather than blanket action. It was reviewed: every call
  # site passes a list built from our own constants and resolved paths.
  "S603",
  # S607 wants absolute paths for executables. The partial names here are
  # Windows system binaries (schtasks, powershell, python) resolved through
  # PATH, which is the conventional and portable form. Hardcoding
  # C:\Windows\System32 would break on non-default installs and buy nothing
  # against an attacker who can already write PATH for this user.
  "S607",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert. That is the entire point of them, and S101 would fire 1,654
# times. Everything else stays on in tests, including in production code where
# a bare assert really is a finding.
"tests/**" = [
  "S101",  # assert
  "S105",  # "token"-shaped fixture names holding no secret
  "S106",  # same, passed as an argument
  "S104",  # tests assert on the 0.0.0.0 handling; they do not bind it
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  # Spawns real subprocesses. Registered so an unknown-mark warning cannot hide
  # a typo that silently stops the mark applying.
  "slow: takes seconds rather than milliseconds",
]
