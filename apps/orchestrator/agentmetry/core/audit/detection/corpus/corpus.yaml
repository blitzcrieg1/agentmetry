# Detection benchmark corpus.
#
# Each case is one recorded session as canonical JSONL, exactly what the trail
# stores, plus the rules that must fire on it. Expectations are written by hand
# from what the session *is*, never pasted from what the engine currently does.
# A corpus that records current behaviour cannot detect a regression in it.
#
# Run:  python -m cli benchmark
# Gate: tests/test_detection_benchmark.py fails CI on any missed rule or any
#       false positive.
#
# Adding a case: drop a .jsonl session in this directory and add an entry here.
# Real sessions are better than written ones; `agentmetry export` output and the
# raw audit-forward.jsonl are both valid sources, with secrets already hashed.

cases:
  # --- attack sessions -------------------------------------------------------

  - name: credential read then network egress
    session: attack_credential_exfil.jsonl
    expect: [credential-exfil]
    note: The canonical chain. A private key read, then a POST off the box.

  - name: credential read then cloud API
    session: attack_credential_then_cloud_api.jsonl
    expect: [credential-read-then-cloud-api]
    note: >
      Hugging Face July 2026 pattern. Note it does NOT trip credential-exfil:
      `aws sts` names no host, so it earns no TA0011 tag. That is the rules
      being precise rather than a gap, and this case pins the distinction.

  - name: dotfile read then git push
    session: attack_dotfile_then_git_push.jsonl
    expect: [dotfile-read-then-git-push]
    note: >
      `git push` carries no URL either, so credential-exfil correctly stays
      silent and the specific rule carries the finding.

  - name: staged download then execute
    session: attack_remote_staging_then_execute.jsonl
    expect: [remote-staging-then-execute]
    note: Fetch from a public staging host, execute in a later step.

  - name: download cradle
    session: attack_encoded_command_download.jsonl
    expect: [encoded-command-download]
    note: Raw-IP fetch piped straight into a shell.

  - name: approval denied then executed anyway
    session: attack_approval_denied_then_executed.jsonl
    expect: [approval-denied-then-executed]
    note: The guardrail-bypass chain. A human said no and the tool ran later.

  - name: recon burst then collection
    session: attack_discovery_then_collect.jsonl
    expect: [discovery-then-collect]

  - name: destructive delete burst
    session: attack_destructive_delete_burst.jsonl
    expect: [destructive-delete-burst]

  - name: pull request merged without reading the diff
    session: attack_pr_merged_without_review.jsonl
    expect: [pr-merged-without-review]
    note: Agent Data Injection section 4.3, supply chain via tool-response injection.

  # --- the two conditions that shipped past 546 unit tests on 2026-07-25 ------

  - name: tied timestamps must not reorder the sequence
    session: attack_timestamp_collision.jsonl
    expect: [credential-read-then-cloud-api]
    note: >
      Both events carry the same timestamp. Windows clock granularity is about
      15 ms, so two calls in one agent turn tie routinely. Ordering used to be
      broken by a random event_id, making this fire or not at random. Every
      unit test hand-builds distinct timestamps, so none of them caught it.

  - name: hashed-only events must still detect
    session: attack_hashed_only_no_command.jsonl
    expect: [credential-read-then-cloud-api]
    note: >
      Default privacy config keeps tool.command out of the trail entirely, so
      the rules have only hook-side trait labels to work with. Most sequence
      rules were once dead on real traffic for exactly this reason.

  # The three cases below cover evasions found by auditing the engine rather
  # than by a detection firing. Each one walked past the rules for months
  # because the corpus only ever contained the shapes somebody thought to write
  # down, which is the honest limitation of a hand-written corpus and the reason
  # to go looking on purpose.

  - name: credential read from the environment, then egress
    session: attack_env_credential_exfil.jsonl
    expect: [credential-exfil]
    note: >
      Same chain as the canonical case, with the secret taken from an
      environment variable instead of a file. Credential recognition described
      only paths, so `echo "$AWS_SECRET_ACCESS_KEY"` was generic Execution and
      this whole session was invisible. Environment variables are how every
      container and CI runner built this decade holds credentials, which made
      this the modal exfil channel rather than an exotic one.

  - name: credential read then egress via a language runtime
    session: attack_interpreter_egress.jsonl
    expect: [credential-exfil]
    note: >
      The network-client list was curl, wget, nc, scp and friends, so
      `python3 -c "urllib.request.urlopen(...)"` earned no TA0011 and the
      sequence could not close. In a hardened container curl is often absent and
      a Python runtime never is.

  - name: whole SSH directory copied, then sent
    session: attack_ssh_directory_exfil.jsonl
    expect: [credential-exfil]
    note: >
      The private-key pattern required a separator after `.ssh`, so a named key
      matched and the directory holding every key did not. `cp -r ~/.ssh /tmp/k`
      produced no traits at all, which made the broadest version of the theft
      the one that got through.

  - name: download cradle via process substitution
    session: attack_proc_substitution_cradle.jsonl
    expect: [encoded-command-download]
    note: >
      `bash <(curl -fsSL ...)` fetches and executes in one step and contains no
      pipe, so every cradle check that looked for `|` missed it. Does NOT trip
      remote-staging-then-execute: that rule wants the two-step variant, a fetch
      and then a separate execution, and this is a one-liner. The distinction is
      deliberate and this case pins it.

  - name: forty tool calls inside the burst window
    session: attack_session_tool_burst.jsonl
    expect: [session-tool-burst]
    note: >
      Coverage for a rule that had none. 42 successful calls in about eight
      minutes, against a threshold of 40 in ten. Called an attack case because
      that is which half of the corpus it scores in, but the honest reading is
      that this rule asks a question rather than makes an accusation: a heavy
      IDE session reaches this most days, and it fired on a real one during the
      dogfood run. It is here so the threshold cannot drift silently.

  - name: outside content, then a network action
    session: attack_untrusted_input_then_action.jsonl
    expect: [untrusted-input-then-risky-action]
    note: >
      Coverage for the agent-data-injection rule. A fetch of externally-authored
      content, then a POST carrying local data off the box. The rule cannot know
      whether the fetched text caused the POST, and is not trying to: it marks a
      provenance sequence for a human to judge. It fired on a benign real
      session during the dogfood run, which is the expected cost of that design.

  - name: unattended agent writes before any approval
    session: attack_autonomous_unapproved_write.jsonl
    expect: [autonomous-unapproved-write]
    note: >
      Coverage for the rule behind the project's "no default self-approve"
      claim. An autonomous actor performs Impact actions with no
      approval_response anywhere earlier in the session. Paired with
      benign_autonomous_after_approval, which is the same work with a human
      approval first and must stay silent: if that pair ever both fire or both
      go quiet, the approval gate has stopped meaning anything.

  - name: burst of subagent spawns
    session: attack_subagent_swarm.jsonl
    expect: [subagent-swarm-burst]
    note: >
      Coverage for a rule that had none. Six subagent starts in five minutes
      against a threshold of five in fifteen. Note the marker is
      `action.reason` starting `subagent_start:`, not the tool name -- writing
      this case with a `Task` tool call and no marker produced nothing, which is
      worth knowing before anyone tries to reproduce it.

  # --- benign sessions: these are the false-positive measurement -------------
  #
  # Eight sessions added 2026-08-07 for #25. Modelled on shapes seen across four
  # weeks of real dogfood traffic, with neutral content. Deliberately NOT lifted
  # from that trail: 2,635 real events carry local user paths, 367 name
  # unrelated private projects and 36 reference a private repository, and a
  # public corpus is a permanent place to put any of those.
  #
  # A caveat that belongs next to the number rather than in a footnote: this
  # measures whether the rules stay quiet on ordinary work, which is a
  # regression guard. It is not a field false-positive rate. The field rate is
  # what the dogfood run reports, over traffic nobody chose.

  - name: test, fix, test again
    session: benign_test_and_fix_loop.jsonl
    expect: []
    benign: true
    note: The most common shape in real traffic and the least interesting, which is why it belongs here.

  - name: dependency install then build
    session: benign_dependency_install_and_build.jsonl
    expect: []
    benign: true
    note: >
      Includes `rm -rf dist && npm run build`. A deletion followed by a fetch-shaped
      package install is exactly where a cradle rule goes wrong if it stops reading
      package managers as package managers.

  - name: review a diff and push it
    session: benign_git_review_and_push.jsonl
    expect: []
    benign: true
    note: >
      Carries the `git_exfil` trait on a normal push. That trait exists for the Nx
      s1ngularity pattern, and this pins that carrying it alone is not a finding.

  - name: read documentation, then edit docs
    session: benign_research_then_docs.jsonl
    expect: []
    benign: true
    note: >
      Two WebFetch calls, then file edits. Untrusted input followed by local writes
      is not the injection sequence; egress is what completes it. This is the
      near-miss for untrusted-input-then-risky-action.

  - name: reading config that is not credentials
    session: benign_reading_config_that_is_not_secret.jsonl
    expect: []
    benign: true
    note: >
      pyproject.toml, docker-compose.yml, tsconfig.json, a defaults.yaml. Config
      files that sit beside credential files and are not credential files. The
      near-miss for the widened credential patterns.

  - name: probing a service on loopback
    session: benign_local_api_probing.jsonl
    expect: []
    benign: true
    note: >
      curl to 127.0.0.1, write to a temp file, read it back with an interpreter.
      Distinct from benign_loopback_pipe_to_interpreter, which pipes and therefore
      does fire at low; here the two steps are separate and nothing should fire at all.

  - name: cleaning build artifacts
    session: benign_build_artifact_cleanup.jsonl
    expect: []
    benign: true
    note: >
      Three deletions against a threshold of five. Sits deliberately just under
      destructive-delete-burst, so lowering that threshold breaks this case rather
      than surfacing quietly in production.

  - name: running a database migration
    session: benign_database_migration.jsonl
    expect: []
    benign: true
    note: Schema change plus a psql query. Data manipulation that is the entire point of the task.

  - name: unattended agent writes after a human approved
    session: benign_autonomous_after_approval.jsonl
    expect: []
    benign: true
    note: >
      The near-miss for autonomous-unapproved-write, and the more important half
      of that pair. Identical actions by the same autonomous actor, with an
      approval_response first. A granted approval resets the gate, and if this
      case ever fires the product is punishing operators for using the approval
      flow it asks them to use.


  - name: writing about credentials is not reading them
    session: benign_writing_about_credentials.jsonl
    expect: []
    benign: true
    note: >
      The counterweight to the three cases above, and the harder half. A commit
      message naming `.env` and AWS_SECRET_ACCESS_KEY, an attack string echoed
      into documentation, a fixture written to disk. Every one of these is a
      shape the widened credential and cradle patterns could plausibly fire on,
      and anyone writing detection content or security docs types them all day.
      A tool that punishes you for writing about security gets uninstalled, so
      widening the patterns without this case would have been a bad trade.

  - name: ordinary development session
    session: benign_ordinary_development.jsonl
    expect: []
    benign: true
    note: install, build, commit, push. A push alone is not exfiltration.

  - name: egress before credential read is not exfiltration
    session: benign_reversed_order_is_not_exfil.jsonl
    expect: []
    benign: true
    note: >
      The reversed pair. These rules claim ordering is enforced by position
      rather than co-occurrence; if this case fires, that claim is false.

  - name: loopback is not egress
    session: benign_loopback_is_not_egress.jsonl
    expect: []
    benign: true
    note: >
      Reading a key then hitting your own health endpoint. Tagging localhost as
      command and control buries the one event that matters under a hundred
      that do not.

  - name: package manager after a fetch
    session: benign_package_manager_after_fetch.jsonl
    expect: []
    benign: true
    note: Fetching a requirements file then running pip is not a download cradle.

  - name: long but calm session
    session: benign_long_but_calm_session.jsonl
    expect: []
    benign: true
    note: >
      Thirty read-only calls spread over half an hour. Burst rules measure a
      time window; a long session must not trip them by length alone.

  - name: human-driven deletes currently fire
    session: benign_human_driven_deletes.jsonl
    expect: [destructive-delete-burst]
    note: >
      OPEN QUESTION, recorded as current behaviour rather than silently changed.
      A person clearing build artifacts trips destructive-delete-burst, because
      that rule is the only session rule that does not check actor_type;
      autonomous-unapproved-write and off-hours-activity both do. The rule's own
      docstring frames it as being about agents, and flagging an operator's own
      cleanup as HIGH is the "trains operators to ignore the feed" failure the
      off-hours docstring warns against. Changing detection semantics is the
      operator's call, so this case pins today's behaviour and will fail loudly
      if it changes either way.

  - name: loopback pipe into an interpreter
    session: benign_loopback_pipe_to_interpreter.jsonl
    expect: [encoded-command-download]
    note: >
      Deliberately NOT tagged `benign: true`, despite the activity being benign.
      In this corpus `benign` means "must stay silent", and it is the false
      positive metric the project quotes. This session does fire, at low, so
      counting it as benign would either force the rule silent or quietly weaken
      what a clean benign score means. The activity is harmless; the case is not
      a silence case.
      Issue #38, found by dogfooding minutes into a clean trail. Curling this
      machine's own service and piping the JSON into an interpreter has the
      exact shape of a download cradle and none of the substance. It fired at
      CRITICAL, and developers do this several times an hour, which is how a
      critical becomes the alert people scroll past. It is still recorded,
      because staging a payload on a local port and then executing it is a real
      technique and a rule that goes silent here would miss it. Listed under
      expect because the rule does fire; the point of the case is that it fires
      at low with no T1105 and no TA0011, neither of which a loopback fetch
      earns.

  - name: remote pipe to shell is still a cradle
    session: attack_remote_pipe_to_shell.jsonl
    expect: [encoded-command-download]
    note: >
      The other half of #38, and the more important one. A fix that quietly
      stopped the rule firing at all would pass the loopback case above and
      leave the product worse than before it was written. A domain rather than a
      raw IP on purpose: requiring a bare IP once let exactly this shape through,
      and a domain is what a real attacker uses.

  - name: authoring merge fixtures is not merging
    session: benign_authoring_merge_fixtures.jsonl
    expect: []
    benign: true
    note: >
      Issue #24, found by dogfooding. An agent writing detection content: it
      echoes a merge command into a fixture, heredocs another into a script, and
      commits a doc explaining the risk. Nothing is merged. Before the fix the
      first of these fired pr-merged-without-review at CRITICAL, because trait
      regexes match command text and cannot tell performing an action from
      writing about one. That lands hardest on people authoring detection
      content, security docs and corpus cases -- which is to say, on anyone
      contributing to this file.
